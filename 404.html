<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var l = window.location;
      var base = l.pathname.replace(/\/[^/]*$/, "/");
      l.replace(base + l.search + l.hash);
    })();
  </script>
</head>
<body></body>
</html>
